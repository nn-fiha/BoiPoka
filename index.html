<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3f5a4a" />
    <meta name="description" content="BoiPoka — put every book you've read on one shelf, keep a journal for each, and see what other readers felt." />
    <!-- Link previews on Facebook, Messenger, WhatsApp, X -->
    <meta property="og:site_name" content="BoiPoka" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BoiPoka · আমার পড়ার জগৎ" />
    <meta property="og:description" content="Every book you've read, on one shelf — with your notes, moods and favourite quotes." />
    <meta property="og:url" content="https://boi-poka.vercel.app/" />
    <meta property="og:image" content="https://boi-poka.vercel.app/images/boipoka.png" />
    <meta property="og:image:alt" content="The BoiPoka bookworm bee" />
    <meta name="twitter:card" content="summary" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Limelight&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash
      try {
        const saved = localStorage.getItem("boipoka.theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
    <title>BoiPoka · আমার পড়ার জগৎ</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
